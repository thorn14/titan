name: PR Checks

on:
  pull_request:
    branches: ["*"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Install JavaScript dependencies
        run: pnpm install
      
      - name: TypeScript check
        run: cd apps/desktop && pnpm exec tsc --noEmit
      
      - name: Run linter (Biome)
        run: pnpm --filter desktop run check
      
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      
      - name: Install system dependencies (for Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      
      - name: Rust clippy (Tauri backend)
        run: cd apps/desktop/src-tauri && cargo clippy -- -D warnings
      
      - name: Rust tests (Tauri backend)
        run: cd apps/desktop/src-tauri && cargo test
      
      - name: Run repository pattern scanner
        env:
          FAIL_ON_WARNINGS: ${{ vars.FAIL_ON_WARNINGS || 'false' }}
        run: pnpm run pr-checks
